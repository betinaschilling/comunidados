name: comuni-bot
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
env:
  PUPPETEER_SKIP_DOWNLOAD: "true"
permissions:
  contents: read
concurrency:
  group: comuni-bot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    name: Validar ComuniDados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
